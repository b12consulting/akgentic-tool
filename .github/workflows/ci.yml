name: CI

on:
  push:
  pull_request:
    # version-1.3.x only. For pull_request GitHub loads the workflow from the
    # BASE branch, so a PR targeting master runs master's ci.yml, never this
    # file — listing master here would be dead config implying a trigger that
    # cannot fire.
    branches: [version-1.3.x]
  workflow_dispatch:

env:
  NO_COLOR: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout akgentic-tool
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # akgentic-core resolves from PyPI under the bounds in pyproject.toml.
      # All extras are listed so mypy can analyze the modules that import them.
      - name: Install dependencies
        run: uv pip install -e ".[dev,vector_search,weaviate,docs,vision]"

      # --no-sync: run in the venv built above without re-resolving from a
      # lockfile (there is no project lockfile in this install model).
      - name: Type checking
        run: uv run --no-sync mypy src/

      - name: Linting
        run: uv run --no-sync ruff check src/

      - name: Run tests with coverage
        run: >
          uv run --no-sync pytest tests/
          --cov=akgentic.tool
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=80

      # Deliberately master-only: the badge gist reflects the mainline, and a
      # 1.3.x push must not overwrite it. This step is inert on this branch.
      - name: Update coverage badge
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          COVERAGE=$(python -c "import json; print(int(json.load(open('coverage.json'))['totals']['percent_covered_display']))")
          if [ "$COVERAGE" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 80 ]; then COLOR="green"
          elif [ "$COVERAGE" -ge 70 ]; then COLOR="yellow"
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > badge.json
          gh gist edit c0f2e0aa0a8c184ee8823dd4feefddd5 -f coverage.json badge.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
