[project]
name = "akgentic-tool"
version = "1.6.4"
description = "Tool interface and factory for Akgentic agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["agents", "ai", "akgentic"]

dependencies = [
    "akgentic-core>=1.5.7",
    # Direct since the notification actor names ActorRef/ActorDeadError itself.
    "pykka>=4.4.2",
    "pydantic>=2.0.0",
    "tavily-python>=0.7.12",
    "pydantic-ai>=2,<3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
vector_search = [
    "openai>=1.0.0",
    "numpy>=1.26.0",
]
weaviate = ["weaviate-client>=4.9.0"]
docs = ["markitdown[pdf,docx,xlsx,xls,pptx,outlook]>=0.1"]
vision = ["Pillow>=10.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "openai>=1.0.0",
    "numpy>=1.26.0",
]

# Note: akgentic-* dependencies have NO [tool.uv.sources] entry here.
# - Inside the akgentic-framework bundle workspace, the workspace root's
#   [tool.uv.sources] resolves them as editable workspace members.
# - In standalone CI, they resolve from PyPI under the floors declared above.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

[tool.hatch.build.targets.wheel.force-include]
"src/akgentic/tool/sandbox/sandbox.Dockerfile" = "akgentic/tool/sandbox/sandbox.Dockerfile"

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# tavily-python ships no py.typed marker; SearchTool wraps it behind typed
# signatures, so treat the client itself as untyped rather than failing strict mode.
[[tool.mypy.overrides]]
module = ["tavily.*"]
ignore_missing_imports = true

# MCPTool imports SSETransport/StdioTransport/StreamableHttpTransport from
# pydantic_ai.mcp: real module-level names that pydantic-ai omits from __all__
# (see _mcp_transport_classes). Allow the implicit re-export instead of scattering
# per-import ignores.
[[tool.mypy.overrides]]
module = ["pydantic_ai.mcp"]
implicit_reexport = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
